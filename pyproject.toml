[project]
name = "ops-agent"
version = "0.1.0"
description = "Multi-step B2B sales research agent with full observability"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amir Dhibi" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "anthropic>=0.40.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "tavily-python>=0.5.0",
    "httpx>=0.27.2",
    "selectolax>=0.3.27",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    # v3 removed the ``Langfuse.trace()`` API used in tracing.py. Pin to the
    # 2.x line until the facade is migrated to the v3 ``start_as_current_span``
    # observer pattern.
    "langfuse>=2.55.0,<3.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "mypy>=1.13.0",
    "ruff>=0.7.4",
    "types-aiofiles>=24.1.0",
]
modal = ["modal>=0.66.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "ASYNC",            # async correctness
    "RUF",              # ruff-specific
    "TID",              # tidy imports
    "PL",               # pylint
    "PT",               # pytest
]
ignore = [
    "PLR0913",  # too many arguments. agent nodes need many deps
    "PLR0915",  # too many statements
    "PLR2004",  # magic value. fine in tests
    "E501",     # line length handled by formatter
    "B008",     # Depends() in default args is the FastAPI pattern
    "PLC0415",  # imports inside functions are sometimes intentional (lazy loading)
    "PLW0603",  # global is used for module-level singleton clients
    "SIM117",   # nested with is sometimes clearer
    "RUF001",   # en-dash in ranges (e.g. 0-100) is fine
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["PLR2004", "PT011", "S101", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tavily.*", "selectolax.*", "langgraph.*", "langfuse.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests with mocked external clients",
    "live: tests that hit real APIs (skipped in CI by default)",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 75
show_missing = true
