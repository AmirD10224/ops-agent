name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + type + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install deps
        # Targeting the runner's Python 3.12 (set up above), uv inherits it
        # because we passed --python.
        run: uv pip install --python "${pythonLocation}/bin/python" -e '.[dev]'

      - name: Ruff
        run: uv run --python "${pythonLocation}/bin/python" ruff check backend evals scripts modal_app.py

      - name: Mypy strict
        run: uv run --python "${pythonLocation}/bin/python" mypy backend/app

      - name: Pytest with coverage gate
        env:
          ANTHROPIC_API_KEY: test
          TAVILY_API_KEY: test
        run: uv run --python "${pythonLocation}/bin/python" pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=75

  eval-offline:
    name: eval (offline against fixtures)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"
          enable-cache: true
      - run: uv pip install --python "${pythonLocation}/bin/python" -e '.'
      - run: uv run --python "${pythonLocation}/bin/python" python -m evals.run --offline

  frontend:
    name: frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com
